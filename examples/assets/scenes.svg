  <g id="choice-b" class="scene"><rect width="960" height="960" fill="#421f35"/><circle cx="480" cy="385" r="210" fill="#df5e83" opacity=".38"/><path d="M350 355h260l-44 260H394z" fill="none" stroke="#f4cab5" stroke-width="18" opacity=".9"/><path class="line" d="M330 640l300-330M350 350l55-105 75 105 65-105 55 105"/><text x="480" y="790" text-anchor="middle" class="label">RED WORLDLINE</text></g>
  <g id="convergence" class="scene"><rect width="960" height="960" fill="url(#teal)"/><path class="line" d="M205 250c0 220 50 305 275 410M755 250c0 220-50 305-275 410M480 660v130"/><circle cx="205" cy="250" r="70" fill="#8ad9d0" opacity=".52"/><circle cx="755" cy="250" r="70" fill="#d2e98b" opacity=".52"/><circle cx="480" cy="660" r="92" fill="#fff" opacity=".25"/><text x="480" y="885" text-anchor="middle" class="label">DIFFERENT PATHS · ONE DAWN</text></g>
  <g id="uncertain" class="scene"><rect width="960" height="960" fill="url(#amber)"/><circle cx="330" cy="430" r="150" fill="none" stroke="#fff" stroke-width="10" stroke-dasharray="24 18" opacity=".72"/><circle cx="630" cy="530" r="150" fill="none" stroke="#fff" stroke-width="10" stroke-dasharray="24 18" opacity=".72"/><text x="480" y="510" text-anchor="middle" font-family="system-ui,sans-serif" font-size="150" font-weight="800" fill="#fff" opacity=".88">?</text><text x="480" y="830" text-anchor="middle" class="label">ORDER UNKNOWN</text></g>
