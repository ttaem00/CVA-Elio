<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img">
  <title>엘리오 1.1 멀티버스 이야기 콘셉트 이미지</title>
  <defs>
    <radialGradient id="night" cx="48%" cy="36%"><stop stop-color="#436f9d"/><stop offset=".58" stop-color="#192d4a"/><stop offset="1" stop-color="#0d1728"/></radialGradient>
    <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#34225f"/><stop offset=".5" stop-color="#836bd0"/><stop offset="1" stop-color="#e187aa"/></linearGradient>
    <linearGradient id="teal" x2="1" y2="1"><stop stop-color="#123f4d"/><stop offset=".55" stop-color="#2aa78e"/><stop offset="1" stop-color="#b2d57b"/></linearGradient>
    <linearGradient id="amber" x2="1" y2="1"><stop stop-color="#332839"/><stop offset=".55" stop-color="#a96d38"/><stop offset="1" stop-color="#e4c478"/></linearGradient>
    <linearGradient id="rose" x2="1" y2="1"><stop stop-color="#3f2344"/><stop offset=".48" stop-color="#c05d82"/><stop offset="1" stop-color="#68aabc"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.scene{display:none}.scene:target{display:inline}.label{font:700 30px system-ui,sans-serif;letter-spacing:7px;fill:#fff;opacity:.72}.line{fill:none;stroke:#fff;stroke-width:10;stroke-linecap:round;opacity:.78}</style>
  </defs>
