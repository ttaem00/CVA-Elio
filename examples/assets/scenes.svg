    <path class="line" d="M480 305v165M480 470L214 700M480 470v310M480 470l266 230"/>
    <circle cx="214" cy="700" r="86" fill="#4bbbd0" opacity=".55"/><circle cx="480" cy="780" r="86" fill="#a9cc38" opacity=".55"/><circle cx="746" cy="700" r="86" fill="#e9779d" opacity=".55"/>
    <text x="480" y="885" text-anchor="middle" class="label">SAME NIGHT · THREE POV</text>
  </g>
