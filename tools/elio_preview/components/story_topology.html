<section class="story-topology" aria-labelledby="story-topology-title">
  <header class="story-topology__intro">
    <span>MULTIVERSE MAP · 같은 시간, 다른 가능성</span>
    <h2 id="story-topology-title">{{TITLE}}</h2>
    <p>{{SUMMARY}}</p>
    <div class="story-topology__legend" aria-label="관계도 읽는 법">
      <span><b aria-hidden="true">⇉</b> 같은 시간</span>
      <span><b aria-hidden="true">⑂</b> 선택으로 갈라짐</span>
      <span><b aria-hidden="true">⇥</b> 다시 합류</span>
      <span><b aria-hidden="true">≈</b> 순서가 확실하지 않음</span>
      <span><b aria-hidden="true">◇</b> 서로 다른 세계선</span>
    </div>
  </header>
  <div class="story-topology__groups">{{GROUPS}}</div>
</section>
