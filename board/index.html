  <style>
    .board-loading{position:fixed;inset:0;z-index:1000;display:grid;place-content:center;gap:14px;padding:28px;background:#081723;color:#d6edf4;text-align:center;font:500 15px/1.7 system-ui,sans-serif}
    .board-loading[hidden]{display:none}.board-loading .board-loading-title{font-size:22px;margin:0}.board-loading p{max-width:32rem;margin:0}.board-loading .loading-mark{width:44px;height:6px;margin:0 auto;background:#6bc9d8;border-radius:9px}
    .board-loading button{justify-self:center;min-height:44px;padding:8px 20px;border:1px solid #6ba5b6;border-radius:9px;background:#16394b;color:#edfaff;font:inherit;cursor:pointer}.board-loading button[hidden]{display:none}
  </style>
  <script>
  (()=>{
    let ready=false,timer;
    const trace=new URLSearchParams(location.search).get('profile')==='1',started=Date.now(),stages=[];
    const mark=(name,details={})=>{if(trace)stages.push({name,ms:Date.now()-started,...details});};
    mark('html');
    const message=(title,detail,retry=false)=>{const panel=document.getElementById('board-loading');if(!panel||ready)return;panel.hidden=false;panel.querySelector('.board-loading-title').textContent=title;panel.querySelector('p').textContent=detail;panel.querySelector('button').hidden=!retry;};
    window.ElioBoardStartup={
      mark,
      message:detail=>{mark('document-loaded');message('이야기 흐름을 준비하고 있습니다',detail);},
      ready:()=>{ready=true;clearTimeout(timer);mark('render-ready');document.getElementById('board-loading')?.setAttribute('hidden','');if(trace)requestAnimationFrame(()=>requestAnimationFrame(()=>{mark('paint-ready');document.documentElement.dataset.boardStartup=JSON.stringify({stages,resources:performance.getEntriesByType('resource').map(row=>({path:new URL(row.name,location.href).pathname,type:row.initiatorType,ms:Math.round(row.duration),bytes:row.transferSize}))});}));},
      error:()=>{clearTimeout(timer);message('보드를 불러오지 못했습니다','자료를 다시 불러와 주세요. 계속 열리지 않으면 잠시 후 다시 시도해 주세요.',true);document.getElementById('board-loading')?.setAttribute('role','alert');}
    };
    window.addEventListener('error',event=>{if(event.target?.tagName==='IMG'||event.target?.tagName==='LINK')return;window.ElioBoardStartup.error();},true);
    window.addEventListener('unhandledrejection',()=>window.ElioBoardStartup.error());
    document.addEventListener('DOMContentLoaded',()=>{
      document.getElementById('board-load-retry')?.addEventListener('click',()=>location.reload());
      timer=setTimeout(()=>message('이야기 흐름을 준비하고 있습니다','평소보다 시간이 걸리고 있습니다. 잠시 기다리거나 자료를 다시 불러와 주세요.',true),15000);
    });
  })();
  </script>

  <script>
/* Opt-in local diagnostics. No network, persistent state or event replay. */
(() => {
  'use strict';
  if (new URLSearchParams(location.search).get('profile') !== '1') return;
  let frame = 0, started = 0, previous = 0, intervals = [], tasks = [];
  const observer = typeof PerformanceObserver === 'function' ? new PerformanceObserver(list => {
    for (const entry of list.getEntries()) if (started && entry.startTime >= started) tasks.push(entry.duration);
  }) : null;
  try { observer?.observe({type:'longtask', buffered:false}); } catch {}
  function sample(now) {
    if (previous) intervals.push(now - previous);
    previous = now;
    if (now - started < 5000) { frame = requestAnimationFrame(sample); return; }
    const sorted = intervals.slice().sort((a,b) => a-b);
    const report = {frames:intervals.length, p95_frame_ms:sorted[Math.floor(sorted.length*.95)] || 0,
      max_frame_ms:Math.max(0,...intervals), long_tasks:tasks.length,
      long_task_ms:tasks.reduce((sum,value) => sum+value,0), nodes:document.querySelectorAll('.scene-node').length,
      painted_nodes:[...document.querySelectorAll('.scene-node')].filter(node => getComputedStyle(node).visibility !== 'hidden').length,
      mode:document.body.dataset.mode, reduced:document.body.classList.contains('motion-reduced')};
    document.documentElement.dataset.canvasProfile = JSON.stringify(report);
    frame = 0; started = 0;
  }
  function begin(event) {
    if (frame || !event.target.closest('#viewport,#reader-view-select,#camera-controls')) return;
    intervals = []; tasks = []; previous = 0; started = performance.now();
    document.documentElement.dataset.canvasProfile = 'recording';
    frame = requestAnimationFrame(sample);
  }
  for (const type of ['pointerdown','wheel','keydown','change']) document.addEventListener(type,begin,{capture:true,passive:true});
})();

</script>
